  <style>
    text:not([fill]) { fill: #f2eee5; }
    .display { font-family: Georgia, 'Times New Roman', serif; letter-spacing: -3px; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; letter-spacing: 1.2px; }
  </style>
  <rect width="1000" height="350" fill="#191c1b"/>
  <circle cx="45" cy="38" r="5" fill="#ff785e"/>
  <text x="63" y="43" class="mono" font-size="13">SEATTLE, WA</text>

  <text x="960" y="43" class="mono" text-anchor="end" font-size="13" fill="#b6b6a9">LOCAL AI NERD</text>
  <text x="40" y="149" class="display" font-size="100">Eeshan</text>
  <text x="35" y="244" class="display" font-size="110" font-style="italic" fill="#ff785e">Srivastava</text>
  <g transform="translate(680 100)">
    <path d="M0 0 V145 H280 M0 48 H280 M0 96 H280 M56 0 V145 M112 0 V145 M168 0 V145 M224 0 V145" fill="none" stroke="#353b36"/>
    <path d="M0 127 H280" fill="none" stroke="#b6b6a9" stroke-dasharray="3 7"/>
    <path d="M5 4 C30 4 25 75 66 95 S157 117 274 121" fill="none" stroke="#ff785e" stroke-width="3.5"/>
    <circle cx="274" cy="121" r="5" fill="#ff785e"/>
    <text x="280" y="172" class="display" text-anchor="end" font-size="20" font-style="italic" style="letter-spacing: -.5px" fill="#b6b6a9">Asymptotic</text>
  </g>
  <line x1="40" y1="291" x2="960" y2="291" stroke="#353b36"/>
  <text x="40" y="322" class="mono" font-size="12" fill="#b6b6a9">DATA SCIENCE / LOCAL AI / EXPERIMENTATION</text>
  <text x="960" y="322" class="mono" text-anchor="end" font-size="12" fill="#b6b6a9">eeshans.com</text>
