  <line x1="40" y1="194" x2="960" y2="194" stroke="#353b36"/>
  <text x="40" y="222" class="mono" font-size="12" fill="#b6b6a9">DATA SCIENCE / LOCAL AI / EXPERIMENTATION</text>
  <text x="960" y="222" class="mono" text-anchor="end" font-size="12" fill="#b6b6a9">eeshans.com</text>
