    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; letter-spacing: 1.2px; }
  </style>
  <rect width="1000" height="240" fill="#191c1b"/>
  <circle cx="45" cy="26" r="5" fill="#ff785e"/>
  <text x="63" y="31" class="mono" font-size="13">SEATTLE, WA</text>

  <text x="960" y="31" class="mono" text-anchor="end" font-size="13" fill="#b6b6a9">LOCAL AI NERD</text>
  <text x="40" y="104" class="display" font-size="78">Eeshan</text>
  <text x="35" y="180" class="display" font-size="90" font-style="italic" fill="#ff785e">Srivastava</text>
  <g transform="translate(680 48)">
